<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}CRM Мерч{% endblock %}</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.0/font/bootstrap-icons.css">
    <style>
        body { background-color: #f8f9fa; }
        .sidebar { min-height: 100vh; background-color: #212529; color: white; }
        .sidebar a { color: #adb5bd; text-decoration: none; padding: 10px 15px; display: block; }
        .sidebar a:hover, .sidebar a.active { background-color: #0d6efd; color: white; }
        .main-content { padding: 20px; }
        /* Таблица расчёта по договору: фиксированная ширина колонок,
           чтобы при разворачивании компонентов поля не «съезжали» */
        .calc-table { table-layout: fixed; min-width: 1360px; }
        .calc-table th, .calc-table td { vertical-align: middle; overflow: hidden; }
        .calc-table td { white-space: normal; word-break: break-word; }
        .calc-table .num-cell { white-space: nowrap; text-align: end; }
        /* Компоненты позиции — на всю ширину карточки (colspan по всей таблице) */
        .components-row > td { background-color: #f8f9fa; padding: 0.75rem 1rem !important; }
        .components-row .comp-table { max-width: 720px; }
    </style>
</head>
<body>
    <div class="container-fluid">
        <div class="row">
            <!-- Боковое меню -->
            <nav class="col-md-2 d-none d-md-block sidebar p-0">
                <div class="p-3 text-center border-bottom border-secondary">
                    <h4 class="mb-0">CRM ПроМерч</h4>
                    <small class="text-muted">{{ user.get_full_name|default:user.username }}</small>
                </div>
                <div class="mt-3">
                    <a href="{% url 'dashboard:order_list' %}" class="{% if request.resolver_match.url_name == 'order_list' %}active{% endif %}">
                        <i class="bi bi-list-check"></i> Список заказов
                    </a>
                    <a href="{% url 'dashboard:client_list' %}" class="{% if request.resolver_match.url_name == 'client_list' %}active{% endif %}">
                        <i class="bi bi-people"></i> Клиенты
                    </a>
                    <a href="{% url 'dashboard:contractor_list' %}" class="{% if request.resolver_match.url_name == 'contractor_list' %}active{% endif %}">
                        <i class="bi bi-truck"></i> Подрядчики
                    </a>
                    <hr class="border-secondary">
                    <form action="{% url 'logout' %}" method="post" class="px-3">
                        {% csrf_token %}
                        <button type="submit" class="btn btn-outline-light btn-sm w-100">
                            <i class="bi bi-box-arrow-right"></i> Выйти
                        </button>
                    </form>
                </div>
            </nav>

            <!-- Основной контент -->
            <main class="col-md-10 ms-sm-auto main-content">
                {% if messages %}
                    {% for message in messages %}
                        <div class="alert alert-{{ message.tags }} alert-dismissible fade show" role="alert">
                            {{ message }}
                            <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
                        </div>
                    {% endfor %}
                {% endif %}
                
                {% block content %}
                {% endblock %}
            </main>
        </div>
    </div>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    {% block extra_js %}{% endblock %}
</body>
</html>
